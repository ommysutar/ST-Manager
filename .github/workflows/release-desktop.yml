name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare desktop shell
        run: pnpm --filter @st-manager/desktop build

      - name: Build unsigned Tauri artifacts
        run: pnpm --filter @st-manager/desktop exec tauri build

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-bundle
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
