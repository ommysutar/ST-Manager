name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  AUTH_SECRET: ci-only-auth-secret-minimum-32-characters-long
  AI_PROVIDER: mock
  AI_MODEL: gpt-4o-mini
  API_PORT: "4000"
  SQLITE_URL: file:./prisma/sqlite/ci.db

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Exclude desktop: bundle-web rebuilds apps/web into the shared .next tree and
      # races the normal web/PWA build. Desktop remains covered by desktop-build.
      - name: Build
        run: pnpm exec turbo run build --filter=!@st-manager/desktop

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

  api-integration:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Exclude desktop: its bundle-web script rebuilds apps/web into the same
      # .next tree and races the normal web/PWA build (truncated pages-manifest).
      - name: Build workspace
        run: pnpm exec turbo run build --filter=!@st-manager/desktop

      - name: Prepare SQLite database
        working-directory: packages/database
        run: |
          pnpm exec prisma migrate deploy --config prisma.config.sqlite.ts
          pnpm run db:seed:dev

      - name: Start API
        run: |
          pnpm --filter @st-manager/api start:prod > /tmp/st-manager-api.log 2>&1 &
          echo $! > /tmp/st-manager-api.pid
          for attempt in $(seq 1 30); do
            if curl -sf "http://localhost:${API_PORT}/health" > /dev/null; then
              echo "API ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat /tmp/st-manager-api.log
          exit 1

      - name: API smoke tests
        run: bash apps/api/scripts/ci-smoke.sh

      - name: Stop API
        if: always()
        run: |
          if [[ -f /tmp/st-manager-api.pid ]]; then
            kill "$(cat /tmp/st-manager-api.pid)" || true
          fi

  postgres-integration:
    runs-on: ubuntu-latest
    needs: [quality, test]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: st_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d st_manager"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/st_manager?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Job NODE_ENV=production would omit turbo (devDependency); install with
      # development so the workspace build tooling is available.
      - name: Install dependencies
        env:
          NODE_ENV: development
        run: pnpm install --frozen-lockfile

      # Same desktop/web .next race as api-integration — desktop not needed here.
      - name: Build workspace
        run: pnpm exec turbo run build --filter=!@st-manager/desktop

      - name: Prepare PostgreSQL database
        working-directory: packages/database
        run: |
          pnpm run db:migrate:postgresql:deploy
          pnpm run db:seed:dev

      # Production-like runtime without real Resend credentials (console is supported).
      - name: Start API (PostgreSQL)
        env:
          EMAIL_PROVIDER: console
        run: |
          pnpm --filter @st-manager/api start:prod > /tmp/st-manager-api-pg.log 2>&1 &
          echo $! > /tmp/st-manager-api-pg.pid
          for attempt in $(seq 1 30); do
            if curl -sf "http://localhost:${API_PORT}/health" > /dev/null; then
              echo "API ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          cat /tmp/st-manager-api-pg.log
          exit 1

      - name: PostgreSQL smoke tests
        run: |
          bash apps/api/scripts/dashboard-smoke.sh
          bash apps/api/scripts/clients-smoke.sh
          bash apps/api/scripts/bookings-smoke.sh
          bash apps/api/scripts/sessions-smoke.sh
          bash apps/api/scripts/invoices-smoke.sh

      - name: Stop API
        if: always()
        run: |
          if [[ -f /tmp/st-manager-api-pg.pid ]]; then
            kill "$(cat /tmp/st-manager-api-pg.pid)" || true
          fi

  desktop-build:
    runs-on: ubuntu-latest
    needs: [quality]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare desktop shell
        run: pnpm --filter @st-manager/desktop build

      - name: Build Tauri bundle (unsigned)
        run: pnpm --filter @st-manager/desktop exec tauri build
